name: Publish Package to GitHub Packages

on:
  release:
    types: [created]

# 💡 Permisos explícitos para poder publicar el paquete en GitHub Packages
permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Configura Node.js y genera el archivo .npmrc automáticamente en el runner
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@SeedCodeSv'

      - run: npm install
      - run: npm run build
      
      # Publica usando el token que GitHub genera en el workflow
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}